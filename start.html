<!DOCTYPE html>
<html>
    <head>
        <title>Scantroon - Start</title>

        <style>
            
            body{
                text-align: center;
                font-size: 110%;
            }

            h1{
                margin-top: 200px;
            }

            button{
                text-align: center;
                background-color: rgb(19, 58, 176);
                color: whitesmoke;
                padding: 10px;
                margin-bottom: 10px;
                width: 200px;
            }

            video, #preview{
                width: 100%;
                max-width: 400px;
                border-radius: 8px;
            }

            #status{
                white-space: pre-wrap;
            }

            .error{
                color: #b00020;
            }

        </style>

    </head>

    <body>
        <h1>Please Scan the Answer Key</h1>
        <br>
        <br>

        <button id="startBtn">Scan Answer Key</button>
        <br>

        <!-- Live camera view -->
        <video id="video" autoplay playsinline muted style="display:none;"></video>
        <br>
        <button id="captureBtn" style="display:none;">Take Photo</button>

        <!-- Photo preview -->
        <img id="preview" alt="Captured photo" style="display:none;">
        <br>
        <button id="useBtn" style="display:none;">Use This Photo</button>
        <button id="retakeBtn" style="display:none;">Retake</button>

        <!-- Fallback: opens the phone's camera app if the live camera won't open -->
        <p>Camera not working? Take or choose a photo instead:</p>
        <input id="fileInput" type="file" accept="image/*" capture="environment">

        <p id="status"></p>

        <!-- Appears once the answer key has been read successfully -->
        <button id="continueBtn" style="display:none;" onclick="window.location.href='Scantron.html'">Continue</button>

        <br>
        <br>
        <br>
        <button onclick="window.location.href='Scantron.html'">Back</button>

        <script>
            const video = document.getElementById("video");
            const preview = document.getElementById("preview");
            const statusBox = document.getElementById("status");
            let stream = null;
            let photoBlob = null;

            function show(id, visible) {
                document.getElementById(id).style.display = visible ? "inline-block" : "none";
            }

            function setStatus(message, isError) {
                statusBox.textContent = message;
                statusBox.className = isError ? "error" : "";
            }

            function stopCamera() {
                if (stream) {
                    stream.getTracks().forEach(function (t) { t.stop(); });
                    stream = null;
                }
                video.style.display = "none";
                show("captureBtn", false);
            }

            function showPreview(blob) {
                photoBlob = blob;
                preview.src = URL.createObjectURL(blob);
                preview.style.display = "inline-block";
                show("useBtn", true);
                show("retakeBtn", true);
                show("startBtn", false);
            }

            // 1. Open the camera
            document.getElementById("startBtn").onclick = async function () {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: "environment" } },  // back camera on phones
                        audio: false
                    });
                    video.srcObject = stream;
                    video.style.display = "inline-block";
                    show("captureBtn", true);
                    show("startBtn", false);
                    setStatus("", false);
                } catch (err) {
                    setStatus("Could not open the camera (" + err.name + "). Use the photo option below instead.", true);
                }
            };

            // 2. Take the photo
            document.getElementById("captureBtn").onclick = function () {
                const canvas = document.createElement("canvas");
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext("2d").drawImage(video, 0, 0);
                canvas.toBlob(function (blob) {
                    showPreview(blob);
                    stopCamera();
                }, "image/jpeg", 0.92);
            };

            // Fallback: photo chosen from the file input
            document.getElementById("fileInput").onchange = function (e) {
                if (e.target.files[0]) {
                    stopCamera();
                    showPreview(e.target.files[0]);
                }
            };

            // Retake
            document.getElementById("retakeBtn").onclick = function () {
                photoBlob = null;
                preview.style.display = "none";
                show("useBtn", false);
                show("retakeBtn", false);
                show("startBtn", true);
                setStatus("", false);
            };

            // 3. Send the photo to the server as the ANSWER KEY
            document.getElementById("useBtn").onclick = async function () {
                const form = new FormData();
                form.append("photo", photoBlob, "key.jpg");
                form.append("mode", "key");

                setStatus("Reading the answer key...", false);
                try {
                    const res = await fetch("/scan", { method: "POST", body: form });
                    const data = await res.json();
                    if (!res.ok) {
                        setStatus(data.error || "Something went wrong. Please retake the photo.", true);
                        return;
                    }
                    setStatus("Answer key saved: " + data.answers.join(", "), false);
                    show("useBtn", false);
                    show("continueBtn", true);
                } catch (err) {
                    setStatus("Could not reach the server: " + err.message, true);
                }
            };
        </script>
    </body>
</html>
