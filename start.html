<!DOCTYPE html>
<html>
<head>
    <title>MCQ Scanner - Start</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 150%;
        }

        h1 {
            margin-top: 10%;
            font-size: 70px;
            margin-bottom: 30px;
        }

        button {
            text-align: center;
            background-color: rgb(19, 58, 176);
            color: whitesmoke;
            padding: 20px;
            margin-bottom: 25px;
            width: 300px;
            max-width: 90%;
            font-size: 30px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        video, #preview {
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
        }

        input[type="file"] {
            font-size: 18px;
            max-width: 90%;
        }

        #status {
            white-space: pre-wrap;
            font-size: 22px;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 42px;
            }

            button {
                font-size: 24px;
            }

        }

    </style>

</head>

<body>

    <h1>Please Scan the Answer Key</h1>

    <br>

    <button id="startBtn">Scan Answer Key</button>

    <br>

    <!-- Live camera view -->

    <video id="video" autoplay playsinline muted
           style="display:none;"></video>

    <br>

    <button id="captureBtn" style="display:none;">
        Take Photo
    </button>

    <!-- Photo preview -->

    <img id="preview" alt="Captured photo"
         style="display:none;">

    <br>

    <button id="useBtn" style="display:none;">
        Use This Photo
    </button>

    <button id="retakeBtn" style="display:none;">
        Retake
    </button>

    <!-- Fallback photo upload -->

    <p>Camera not working? Take or choose a photo instead:</p>

    <input id="fileInput" type="file"
           accept="image/*" capture="environment">

    <p id="status"></p>

    <!-- Appears once the answer key is saved -->

    <button id="continueBtn" style="display:none;"
            onclick="window.location.href='/students'">
        Continue
    </button>

    <br>
    <br>

    <button onclick="window.location.href='/'">
        Back
    </button>

    <script>

        const video = document.getElementById("video");
        const preview = document.getElementById("preview");
        const statusBox = document.getElementById("status");
        const fileInput = document.getElementById("fileInput");

        let stream = null;
        let photoBlob = null;
        let previewURL = null;
        let submitting = false;
        let saved = false;

        function show(id, visible) {

            document.getElementById(id).style.display =
                visible ? "inline-block" : "none";

        }


        function setStatus(message, isError) {

            statusBox.textContent = message;
            statusBox.className = isError ? "error" : "";

        }


        function stopCamera() {

            if (stream) {

                stream.getTracks().forEach(function (t) {
                    t.stop();
                });

                stream = null;

            }

            video.srcObject = null;
            video.style.display = "none";

            show("captureBtn", false);

        }


        function clearPreview() {

            if (previewURL) {
                URL.revokeObjectURL(previewURL);
                previewURL = null;
            }

            photoBlob = null;

            preview.removeAttribute("src");
            preview.style.display = "none";

        }


        function showPreview(blob) {

            if (!blob || submitting || saved) {
                return;
            }

            clearPreview();

            photoBlob = blob;

            previewURL = URL.createObjectURL(blob);
            preview.src = previewURL;

            preview.style.display = "inline-block";

            show("useBtn", true);
            show("retakeBtn", true);
            show("startBtn", false);

            setStatus("", false);

        }


        // 1. Open the camera

        document.getElementById("startBtn").onclick =
            async function () {

                if (submitting || saved || stream) {
                    return;
                }

                try {

                    stream = await navigator.mediaDevices.getUserMedia({

                        video: {
                            facingMode: {
                                ideal: "environment"
                            }
                        },

                        audio: false

                    });

                    video.srcObject = stream;
                    video.style.display = "inline-block";

                    show("captureBtn", true);
                    show("startBtn", false);

                    setStatus("", false);

                } catch (err) {

                    setStatus(
                        "Could not open the camera (" +
                        err.name +
                        "). Use the photo option below instead.",
                        true
                    );

                }

            };


        // 2. Take the photo

        document.getElementById("captureBtn").onclick =
            function () {

                if (!video.videoWidth || !video.videoHeight) {

                    setStatus("Camera is not ready.", true);
                    return;

                }

                const canvas = document.createElement("canvas");

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                canvas.getContext("2d").drawImage(video, 0, 0);

                canvas.toBlob(function (blob) {

                    stopCamera();
                    showPreview(blob);

                }, "image/jpeg", 0.92);

            };


        // Fallback: choose a photo

        fileInput.onchange = function (e) {

            if (e.target.files[0] && !submitting && !saved) {

                stopCamera();
                showPreview(e.target.files[0]);

            }

        };


        // Retake the photo

        document.getElementById("retakeBtn").onclick =
            function () {

                if (submitting || saved) {
                    return;
                }

                clearPreview();

                fileInput.value = "";

                show("useBtn", false);
                show("retakeBtn", false);
                show("startBtn", true);
                show("continueBtn", false);

                setStatus("", false);

            };


        // 3. Send the photo as the answer key

        document.getElementById("useBtn").onclick =
            async function () {

                if (!photoBlob || submitting || saved) {
                    return;
                }

                submitting = true;

                document.getElementById("useBtn").disabled = true;
                document.getElementById("retakeBtn").disabled = true;

                fileInput.disabled = true;

                const form = new FormData();

                form.append("photo", photoBlob, "key.jpg");
                form.append("mode", "key");

                setStatus("Reading the answer key...", false);

                try {

                    const res = await fetch("/scan", {
                        method: "POST",
                        body: form
                    });

                    const data = await res.json();

                    if (!res.ok) {

                        setStatus(
                            data.error ||
                            "Something went wrong. Please retake the photo.",
                            true
                        );

                        return;

                    }

                    saved = true;

                    setStatus(
                        "Answer key saved: " +
                        data.answers.join(", "),
                        false
                    );

                    show("useBtn", false);
                    show("retakeBtn", false);
                    show("continueBtn", true);

                } catch (err) {

                    setStatus(
                        "Could not reach the server: " +
                        err.message,
                        true
                    );

                } finally {

                    submitting = false;

                    document.getElementById("useBtn").disabled = false;
                    document.getElementById("retakeBtn").disabled = false;

                    if (!saved) {
                        fileInput.disabled = false;
                    }

                }

            };


        window.addEventListener("pagehide", function () {

            stopCamera();
            clearPreview();

        });

    </script>

</body>
</html>
